type: custom:button-card
# ── Target entity to toggle on tap ─────────────────────────
entity: switch.tasmota_mk4
show_name: false
show_state: false
show_icon: false
variables:
  # ── Up to 4 sensor values displayed in the subtitle (min 1)
  entity_value_1: sensor.tasmota_mk4_energy_power
  entity_value_2: sensor.prusalink_nozzle_temperature
  entity_value_3: sensor.prusalink_heatbed_temperature
  entity_value_4: sensor.ble_temperature_thermometer_enclosure

  # ── Entity used to trigger background color change ─────────
  threshold_entity: sensor.tasmota_mk4_energy_power
  # ── Value above which the background color changes ─────────
  threshold_value: 5

  # ── Display name shown on the card ─────────────────────────
  card_name: Prusa MK4

  # ── Units appended to each sensor value ────────────────────
  unit_1: W
  unit_2: "°C"
  unit_3: "°C"
  unit_4: "°C"

  # ── Decimal places for each sensor value ───────────────────
  decimals_1: 0
  decimals_2: 0
  decimals_3: 0
  decimals_4: 1

  # ── Icon (any mdi: icon) ────────────────────────────────────
  icon: mdi:printer-3d

  # ── Icon color when entity is on ───────────────────────────
  color_active: "#97BE5A"
  # ── Icon color when entity is off ──────────────────────────
  color_inactive: "#9E9E9E"
  # ── Background color when threshold is exceeded ────────────
  color_threshold_bg: "#FFC470"
  # ── Opacity of the threshold background (0.0 – 1.0) ────────
  threshold_bg_opacity: 0.6

  # ── Show confirmation dialog on tap (true/false) ────────────
  confirmation_enabled: true
  # ── Text shown in the confirmation dialog ──────────────────
  confirmation_text: Prusa MK4 wirklich schalten?
styles:
  card:
    - padding: 0
    - border-radius: 12px
    - cursor: pointer
    - background: |
        [[[
          // Turn background orange when threshold entity exceeds threshold value
          const v = parseFloat(states[variables.threshold_entity]?.state) || 0;
          if (v > variables.threshold_value) {
            const hex = variables.color_threshold_bg.replace('#','');
            const r = parseInt(hex.substring(0,2),16);
            const g = parseInt(hex.substring(2,4),16);
            const b = parseInt(hex.substring(4,6),16);
            return `rgba(${r},${g},${b},${variables.threshold_bg_opacity})`;
          }
          return 'var(--card-background-color, #f5f5f5)';
        ]]]
    - transition: background 0.3s
  grid:
    - grid-template-areas: '"content"'
    - grid-template-columns: 1fr
    - grid-template-rows: 1fr
  custom_fields:
    content:
      - width: 100%
      - padding: 0px
      - box-sizing: border-box
tap_action:
  action: toggle
  # Show native HA confirmation dialog if confirmation_enabled is true
  confirmation: >-
    [[[ return variables.confirmation_enabled ? { text:
    variables.confirmation_text } : false; ]]]
custom_fields:
  content: |
    [[[
      // ── Read sensor states ────────────────────────────────────
      const v1 = states[variables.entity_value_1]?.state;
      const v2 = variables.entity_value_2 ? states[variables.entity_value_2]?.state : null;
      const v3 = variables.entity_value_3 ? states[variables.entity_value_3]?.state : null;
      const v4 = variables.entity_value_4 ? states[variables.entity_value_4]?.state : null;

      // ── Determine toggle state ────────────────────────────────
      const toggleState = states[variables.entity_toggle]?.state;
      const isOn = toggleState === 'on';

      // ── Format a sensor value with unit and decimal places ────
      function fmt(val, unit, decimals) {
        if (!val || val === 'unavailable' || val === 'unknown') return '—';
        const d = (decimals !== undefined && decimals !== null) ? decimals : 1;
        const num = parseFloat(val);
        const formatted = isNaN(num) ? val : num.toFixed(d);
        return unit ? `${formatted} ${unit}` : formatted;
      }

      const display1 = fmt(v1, variables.unit_1, variables.decimals_1);
      const display2 = v2 !== null ? fmt(v2, variables.unit_2, variables.decimals_2) : null;
      const display3 = v3 !== null ? fmt(v3, variables.unit_3, variables.decimals_3) : null;
      const display4 = v4 !== null ? fmt(v4, variables.unit_4, variables.decimals_4) : null;

      // ── Join non-null values with a separator ─────────────────
      const secondaryLine = [display1, display2, display3, display4]
        .filter(v => v !== null)
        .join('\u00a0·\u00a0');

      // ── Resolve icon color based on toggle state ──────────────
      const iconColor = isOn ? variables.color_active : variables.color_inactive;

      // ── Convert hex color to rgba with given opacity ──────────
      function hexToRgba(hex, alpha) {
        const h = hex.replace('#','');
        const r = parseInt(h.substring(0,2),16);
        const g = parseInt(h.substring(2,4),16);
        const b = parseInt(h.substring(4,6),16);
        return `rgba(${r},${g},${b},${alpha})`;
      }

      // ── Icon background: color_active/inactive at 15% opacity ─
      const iconBg = hexToRgba(iconColor, 0.15);

      // ── Render card HTML ──────────────────────────────────────
      return `
        <div style="font-family:var(--primary-font-family,sans-serif);display:flex;align-items:center;gap:12px;padding:8px;text-align:left">
          <div style="width:44px;height:44px;border-radius:10px;background:${iconBg};border:0.5px solid rgba(128,128,128,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <ha-icon icon="${variables.icon}" style="--mdc-icon-size:30px;color:${iconColor}"></ha-icon>
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:500;line-height:1.3">${variables.card_name}</div>
            <div style="font-size:12px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${secondaryLine}</div>
          </div>
        </div>`;
    ]]]
